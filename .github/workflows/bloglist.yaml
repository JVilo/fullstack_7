name: Bloglist tests

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.11.0
        with:
          mongodb-version: 'latest'

      - name: Install server dependencies
        working-directory: bloglist/server
        run: npm ci

      - name: Install client dependencies
        working-directory: bloglist/client
        run: npm ci

      - name: Install test dependencies
        working-directory: bloglist-tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: bloglist-tests
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: bloglist-tests
        env:
          TEST_MONGODB_URI: mongodb://localhost:27017/bloglistTest
          SECRET: salainen_avain_tokenin_allekirjoitukseen
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: bloglist-tests/playwright-report/
          retention-days: 14